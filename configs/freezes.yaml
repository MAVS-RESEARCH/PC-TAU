  F100: {E: true, R: false, A: false}
  F010: {E: false, R: true, A: false}
  F001: {E: false, R: false, A: true}
  F110: {E: true, R: true, A: false}
  F101: {E: true, R: false, A: true}
  F011: {E: false, R: true, A: true}
  F111: {E: true, R: true, A: true}
